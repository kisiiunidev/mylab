
{% extends "base.html" %}
{% block title %}Upload · Cloud Storage{% endblock %}

{% block content %}
<h1>Upload a file</h1>
<p>Files are stored in Cloudflare R2.</p>

<form class="upload-form" method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="file">Choose file</label>
    <input id="file" type="file" name="file" required>

    <label for="folder">Folder (optional)</label>
    <input id="folder" type="text" name="folder"
           placeholder="documents/invoices">

    <button type="submit">Upload to cloud</button>
</form>
{% endblock %}
